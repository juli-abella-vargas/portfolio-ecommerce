<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - COMPRAR E VENDER - Cadastro de {{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h4>Cadastro de {{ titulo }}</h4>
        </div>

        <form action="{{ url_for('novacategoria') }}" method="post" autocomplete="off">
            <p><a href="{{ url_for('index') }}">Início</a></p>

            <div class="form-group">
                <label for="nome">Nome da Categoria</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="desc">Descrição</label>
                <input type="text" class="form-control" id="desc" name="desc" required>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
    </div>

    <br>

    <div class="container">
        <div class="page-header">
            <h4>Lista de Categorias</h4>
        </div>

        <table class="table table-striped table-responsive table-bordered">
            <thead class="thead-default">
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Editar</th>
                    <th>Deletar</th>
                </tr>
            </thead>
            <tbody>
                {% for item in categorias %}
                <tr>
                    <td>{{ item.nome }}</td>
                    <td>{{ item.desc }}</td>
                    <td><a href="{{ url_for('editar_categoria', id=item.id) }}">Editar</a></td>
                    <td><a href="{{ url_for('deletar_categoria', id=item.id) }}" onclick="return confirm('Tem certeza que deseja deletar esta categoria?');">Deletar X</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <br>
        <p><a href="{{ url_for('index') }}">&larr; Voltar para o Início</a></p>
    </div>
</body>
</html>
