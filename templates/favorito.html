<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - Cadastro de {{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h4>Cadastro de {{ titulo }}</h4>
        </div>

        <form action="{{ url_for('salvar_favorito') }}" method="post">
            <p><a href="{{ url_for('index') }}">Início</a></p>

            <div class="form-group">
                <label for="anuncio_id">Anúncio ID</label>
                <input type="number" class="form-control" id="anuncio_id" name="anuncio_id" required>
            </div>

            <button type="submit" class="btn btn-primary">Salvar Favorito</button>
        </form>
    </div>

    <br>

    <div class="container">
        <div class="page-header">
            <h4>Lista de {{ titulo }}</h4>
        </div>

        <table class="table table-striped table-responsive table-bordered">
            <thead class="thead-default">
                <tr>
                    <th>ID</th>
                    <th>Usuário ID</th>
                    <th>Anúncio ID</th>
                    <th>Deletar</th>
                </tr>
            </thead>
            <tbody>
                {% for f in favoritos %}
                <tr>
                    <td>#{{ f.id }}</td>
                    <td>{{ f.usuario_id }}</td>
                    <td>{{ f.anuncio_id }}</td>
                    <td><a href="/favorito/deletar/{{ f.id }}">Deletar X</a></td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4">Nenhum favorito cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <br>
        <p><a href="{{ url_for('index') }}">&larr; Voltar para o Início</a></p>
    </div>
</body>
</html>
