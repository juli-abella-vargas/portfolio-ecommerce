<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - COMPRAR E VENDER - Cadrastro de {{titulo}}</title>
    <link rel="stylesheet" href="../static/css/bootstrap.css">
</head>

<body>   
    <div class="container">
        <div class="page-header">
            <h4>Cadastro de {{titulo}}</h4>
        </div>
        <form action="/usuario/criar" method="post">
            <p>
                <a href="/login">Já tem conta? Faça Login</a> | 
                <a href="/">Início</a>
            </p>

            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="text" class="form-control" id="email" name="email" required>
            </div>
    
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
    </div>

    {% if current_user.is_authenticated %}
    <div class="container">
        <div class="page-header">
            <h4>Lista de {{titulo}}</h4>
        </div>
        <table class="table table-striped table-responsive table-bordered">
            <thead class="thead-default">
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Senha</th>
                    <th>Editar</th>
                    <th>Deletar</th>
                </tr>
            </thead>
            <tbody>
                {% for usuario in usuarios %}
                <tr>
                    <td>{{ usuario.nome }}</td>
                    <td>{{ usuario.email }}</td>
                    <td>{{ usuario.senha }}</td>
                    <td><a href="/usuario/editar/{{ usuario.id }}">Editar</a></td>
                    <td><a href="/usuario/deletar/{{ usuario.id }}" onclick="return confirm('Tem certeza que deseja deletar este usuário?');">Deletar</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% endif %}
</body>

</html>
