<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - Relatório de vendas {{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h4>Relatório de Vendas</h4>
        </div>

        <table class="table table-striped table-responsive table-bordered">
            <thead class="thead-default">
                <tr>
                    <th>ID da Venda</th>
                    <th>Anúncio ID</th>
                    <th>Quantidade vendida</th>
                </tr>
            </thead>
            <tbody>
                {% for v in vendas %}
                <tr>
                    <td>#{{ v.id }}</td>
                    <td>{{ v.anuncio_id }}</td>
                    <td>{{ v.quantidade }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3">Nenhuma venda registrada.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <br>
        <p><a href="{{ url_for('index') }}">&larr; Voltar ao Início</a></p>
    </div>
</body>
</html>
