<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - COMPRAR E VENDER - Editar Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h4>Editar {{ titulo }}</h4>
        </div>

        <form action="{{ url_for('atualizar_usuario', id=usuario.id) }}" method="post">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ usuario.nome }}" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email }}" required>
            </div>

            <div class="form-group">
                <label for="senha">Nova Senha (deixe em branco se não quiser alterar):</label>
                <input type="password" class="form-control" id="senha" name="senha" value="">
            </div>

            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="{{ url_for('usuario') }}" class="btn btn-default">Cancelar</a>
        </form>
    </div>
</body>
</html>
