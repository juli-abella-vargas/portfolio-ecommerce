<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - Editar {{ titulo }}</title>
</head>
<body>

    <h4>Editar {{ titulo }} #{{ anuncio.id }}</h4>

    <form action="/anuncio/atualizar/{{ anuncio.id }}" method="post">
        <p>
            <label for="titulo">Título do Anúncio</label><br>
            <input type="text" id="titulo" name="titulo" value="{{ anuncio.titulo }}" required>
        </p>

        <p>
            <label for="descricao">Descrição</label><br>
            <textarea rows="4" cols="50" id="descricao" name="descricao" required>{{ anuncio.descricao }}</textarea>
        </p>

        <p>
            <label for="preco">Preço (R$)</label><br>
            <input type="number" step="0.01" id="preco" name="preco" value="{{ anuncio.preco }}" required>
        </p>

        <p>
            <label for="estoque">Estoque</label><br>
            <input type="number" id="estoque" name="estoque" value="{{ anuncio.quantidade }}" required>
        </p>

        <p>
            <input type="submit" value="Salvar Alterações">
            <a href="/anuncio">Cancelar</a>
        </p>
    </form>

</body>
</html>
