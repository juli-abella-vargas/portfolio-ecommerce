<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - Editar {{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
</head>

<body>
    <div class="container">
        <div class="page-header">
            <h4>Editar {{ titulo }} #{{ anuncio.id }}</h4>
        </div>

        <form action="{{ url_for('atualizar_anuncio', id=anuncio.id) }}" method="post">
            <div class="form-group">
                <label for="titulo">Título do Anúncio</label>
                <input type="text" class="form-control" id="titulo" name="titulo" value="{{ anuncio.titulo }}" required>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$)</label>
                <input type="number" step="0.01" class="form-control" id="preco" name="preco" value="{{ anuncio.preco }}" required>
            </div>

            <div class="form-group">
                <label for="estoque">Estoque</label>
                <input type="number" class="form-control" id="estoque" name="estoque" value="{{ anuncio.quantidade }}" required>
            </div>

            <div class="form-group">
                <label for="categoria_id">Categoria do Anúncio</label>
                <select name="categoria_id" id="categoria_id" class="form-control" required>
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if cat.id == anuncio.categoria_id %}selected{% endif %}>
                            {{ cat.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="{{ url_for('anuncio') }}" class="btn btn-default">Cancelar</a>
        </form>
    </div>
</body>
</html>
