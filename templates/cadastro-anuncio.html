<!DOCTYPE html>
<html>
<head>
    <title>vou_inventar - COMPRAR E VENDER - Cadastro de {{titulo}}</title>
</head>

<body>
    <h4> Cadastrar Novo {{titulo}}</h4>

   <form action="/anuncio/criar" method="post" autocomplete="off">
        <p><a href="/">Início</a></p>

        <p><label for="titulo">Título do Anúncio</label></p>
        <p><input type="text" id="titulo" name="titulo" required></p>

        <p><label for="descricao">Descrição</label></p>
        <p><textarea rows="4" cols="50" id="descricao" name="descricao" required></textarea></p>

        <p><label for="preco">Preço (R$)</label></p>
        <p><input type="number" step="0.01" id="preco" name="preco" required></p>

        <p><label for="estoque">Estoque</label></p>
        <p><input type="number" id="estoque" name="estoque" required></p>

        <p><input type="submit" value="Cadastrar"></p>
    </form>

    <br>
    <h4>Lista de Anúncios</h4>
    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Editar</th>
                <th>Deletar</th>
            </tr>
        </thead>
        <tbody>
            {% for item in anuncios %}
            <tr>
                <td>{{ item.titulo }}</td>
                <td>{{ item.descricao }}</td>
                <td>R$ {{ item.preco }}</td>
                <td>{{ item.quantidade }}</td>
                <td><a href="/anuncio/editar/{{ item.id }}">Editar</a></td>
                <td><a href="/anuncio/deletar/{{ item.id }}">Deletar X</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="/">&larr; Voltar para o Início</a>

</body>
</html>
